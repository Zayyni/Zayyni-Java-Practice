<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .welcome-container {
            text-align: center;
            background: white;

            padding: 50px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 20px;

            padding: 10px 20px;

            background: #dc3545;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>

<body>

<div class="welcome-container">

    <h1>Welcome!</h1>

    <p>You have successfully logged in with Google.</p>

    <a href="/logout" class="logout-btn">
        Logout
    </a>

</div>

</body>
</html>
