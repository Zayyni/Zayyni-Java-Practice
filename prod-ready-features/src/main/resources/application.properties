spring.application.name=prod-ready-features

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=false
spring.devtools.restart.exclude= src/main/java/com/zayyni/prodreadyfeatures/dto/**

server.port=9000
employeeService.base.url=http://localhost:8080

#logging configuration

logging.level.com.zayyni.prodreadyfeatures.clients=TRACE
logging.pattern.console=%d [%level] [%c{2.}] --- %m%n
logging.file.name=application.log
#logging.config=classpath:logback-spring.xml

#actuator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.author=Zayyni
info.app.version=1.0.0
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#Open api doc configuration
#api-docs path  -> v3/api-docs
#swagger path -> swagger-ui.html
springdoc.api-docs.enabled=true